# Drop-in fuer den Ollama-Systemdienst (Linux ohne Docker), installiert vom
# offiziellen Ollama-Installer als /etc/systemd/system/ollama.service.
#
# Installieren:
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp deploy/linux/ollama-override.conf /etc/systemd/system/ollama.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama

[Service]
Environment="OLLAMA_HOST=0.0.0.0:11434"
Environment="OLLAMA_KEEP_ALIVE=-1"
# Der KV-Cache-Typ wirkt NUR hier. Der Proxy bekommt denselben Wert
# (deploy/linux/ollama-proxy.service), damit Anzeige und Prognose stimmen.
Environment="OLLAMA_KV_CACHE_TYPE=q8_0"
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=3"
# Prompt-Cache des llama-server begrenzen (Default 8192 MiB, 32 Checkpoints):
# Environment="LLAMA_ARG_CACHE_RAM=4096"
# Environment="LLAMA_ARG_CTX_CHECKPOINTS=8"
# Nur falls Ollama die GPU nicht erkennt (laut Ollama-Doku fuer gfx1151 nicht noetig):
# Environment="HSA_OVERRIDE_GFX_VERSION=11.5.1"
