name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements.txt pytest==8.3.4
      - name: Syntax check
        run: python -c "import ast; ast.parse(open('ollama_proxy.py', encoding='utf-8').read())"
      - name: Tests
        run: python -m pytest -q tests
      - name: Docker build
        run: docker build -t ollama-proxy:ci .
